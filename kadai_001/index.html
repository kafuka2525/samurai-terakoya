<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
    <title>My Profile</title>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>
                <a href="index.html" class="home">My Profile</a>
            </h1>
            <nav class="nav-inner">
                <a href="#about" class="nav-about">About</a>
                <a href="#works" class="nav-works">Works</a>
            </nav>
        </div>
    </header>
    <main>
        <article>
            <div id="main-visual">
                <img src="/images/main.png" alt="カメラの写真" class="first-view">
            </div>

            <section class="section-style">
                <h2 id="about">About</h2>
                <div class="about-inner">
                    <img src="/images/about.png" alt="自身の写真" class="self-photo">
                    <div class="profile-text">
                        <p class="name">Kazuki Asahina</p>
                        <ul>
                            <li>25歳 長野県佐久市出身</li>
                            <li>ソフトウェア業界でマーケティングに従事</li>
                            <li>趣味はカメラ、愛機はCanon</li>
                            <li>自然を撮影するのが好きで、海や山によく行く</li>
                        </ul>
                    </div>
                </div>
            </section>
            
            <section class="section-style">
                <h2 id="works">Works</h2>
                <div class="works-inner">
                    <div class="nigata">
                        <img src="/images/works1.png" alt="日本海の写真">
                        <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</p>
                    </div>
                    <div class="nagano">
                        <img src="/images/works2.png" alt="御嶽山の写真">
                        <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
                    </div>
                    <div class="kyoto">
                        <img src="/images/works3.png" alt="京都の街並みの写真">
                        <p>京都で撮影した、明け方の古き良き日本の町並み</p>
                    </div>
                </div>
            </section>

            <footer id="footer-inner">
                <p>&copy;MyProfile. All rights reserved.</p>
            </footer>
        </article>
    </main>
</body>
</html>
